# Reading ease is drastically reduced on read the doc after 103 chars
# (Because of horizontal scrolling)
line-length = 103

extend-exclude = [
    "messages/d/duplicate-argument-name/bad.py",
    "messages/m/multiple-class-sub-patterns/bad.py",
    "messages/s/syntax-error/bad.py",
    # syntax error in newer python versions
    "messages/b/bare-name-capture-pattern/bad.py",
    "messages/s/star-needs-assignment-target/bad.py",
    "messages/i/invalid-star-assignment-target/bad.py",
    "messages/u/using-exception-groups-in-unsupported-version/bad.py",
    "messages/u/using-generic-type-syntax-in-unsupported-version/bad.py",
    # deliberately shows the position where Python forbids a lazy import
    "messages/i/invalid-lazy-import/bad.py",
]

# The examples showing off the newest syntax need the most recent grammar
[per-file-target-version]
"messages/u/using-comprehension-unpacking-in-unsupported-version/bad.py" = "py315"
"messages/i/invalid-lazy-import/good.py" = "py315"
"messages/u/using-lazy-import-in-unsupported-version/bad.py" = "py315"

[lint]
ignore = []
select = ["E501", "I"]


[lint.per-file-ignores]
"messages/m/misplaced-future/bad.py" = ["I"]
"messages/m/multiple-imports/bad.py" = ["I"]
"messages/r/reimported/bad.py" = ["I"]
"messages/u/ungrouped-imports/bad.py" = ["I"]
"messages/w/wrong-import-order/bad.py" = ["I"]
