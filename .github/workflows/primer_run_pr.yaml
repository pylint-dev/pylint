# Most of this is inspired by the mypy primer
# See: https://github.com/hauntsaninja/mypy_primer
# This is the primer job that runs on every PR

name: Primer / Run

on:
  pull_request:
    paths:
      - "pylint/**"
      - "tests/primer/**"
      - "requirements*"
      - ".github/workflows/**"
      # We ignore these specific files because they need to be changed
      # on 'main' and will always fail the PR run.
      - "!.github/workflows/primer_run_main.yaml"
      - "!.github/workflows/primer_comment.yaml"
      - "!tests/primer/packages_to_prime.json"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # This needs to be the SAME as in the Main and comment job
  CACHE_VERSION: 4
  KEY_PREFIX: venv-primer

permissions:
  contents: read

jobs:
  run-primer:
    name: Run / ${{ matrix.python-version }} / batch index ${{ matrix.batchIdx }}
    runs-on: ubuntu-latest
    # Up to twice the time of 'Primer / Main' when it lints 'main' too
    timeout-minutes: 75
    strategy:
      matrix:
        python-version: ["3.10", "3.15"]
        batches: [4]
        batchIdx: [0, 1, 2, 3]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true

      # Restore cached Python environment
      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key:
            ${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{
            env.KEY_PREFIX }}-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml',
            'requirements_test.txt', 'requirements_test_min.txt',
            'requirements_test_pre_commit.txt') }}
      # Create environment must match step in 'Primer / Main'
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install --upgrade --requirement requirements_test.txt
      # Save cached Python environment (explicit because cancel-in-progress: true)
      - name: Save Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key:
            ${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{
            env.KEY_PREFIX }}-${{ env.CACHE_VERSION }}-${{ hashFiles('pyproject.toml',
            'requirements_test.txt', 'requirements_test_min.txt',
            'requirements_test_pre_commit.txt') }}
      # The cached venv contains the pylint that was installed when the cache was
      # created, which can be stale or even broken if it was created on an earlier
      # (force-pushed away) commit of this PR. Reinstall from the current checkout
      # so every following step uses the right code (see #11153).
      - name: Install pylint from the current checkout
        run: |
          . venv/bin/activate
          pip install . --no-deps

      # Cache primer packages
      - name: Download last 'main' run info
        id: download-main-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMIT_STRING_ARTIFACT: primer_commitstring_${{ matrix.python-version }}
          OUTPUT_ARTIFACT:
            primer_output_main_${{ matrix.python-version }}_batch${{ matrix.batchIdx }}
        with:
          script: |
            const { COMMIT_STRING_ARTIFACT, OUTPUT_ARTIFACT } = process.env
            const fs = require('fs');
            // Without the output of the 'Primer / Main' run of the 'main' commit
            // this PR is merged into, the next steps lint that commit themselves.
            const lintMainHere = "'main' will be linted in this job instead."
            // Look up the run by commit: listing the latest runs sometimes returns
            // a stale page, with old runs only.
            const { stdout } = await exec.getExecOutput("git", ["rev-parse", "HEAD^1"]);
            const mainSha = stdout.trim()
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: ".github/workflows/primer_run_main.yaml",
              head_sha: mainSha,
            });
            const lastRunMain = runs.data.workflow_runs.find((run) => run.conclusion === "success")
            if (!lastRunMain) {
              // Right after a merge, the 'main' primer of the new commit is still running.
              const pendingRun = runs.data.workflow_runs.find((run) => run.status !== "completed")
              const reason = pendingRun
                ? `The primer on 'main' for ${mainSha} has not finished yet (${pendingRun.html_url}).`
                : `No successful primer run on 'main' for ${mainSha}.`
              core.notice(`${reason} ${lintMainHere}`)
              return false
            }
            console.log("Last run on main:")
            console.log(lastRunMain.html_url)
            const artifacts_main = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: lastRunMain.id,
            });
            const artifactsByName = new Map(
              artifacts_main.data.artifacts
                .filter((artifact) => !artifact.expired)
                .map((artifact) => [artifact.name, artifact])
            );
            const artifactNames = [COMMIT_STRING_ARTIFACT, OUTPUT_ARTIFACT]
            if (artifactNames.some((name) => !artifactsByName.has(name))) {
              core.notice(`The artifacts of ${lastRunMain.html_url} are missing or expired. ${lintMainHere}`)
              return false
            }
            for (const name of artifactNames) {
              const downloaded = await github.rest.actions.downloadArtifact({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 artifact_id: artifactsByName.get(name).id,
                 archive_format: "zip",
              });
              fs.writeFileSync(`${name}.zip`, Buffer.from(downloaded.data));
            }
            return true
      - name: Copy and unzip the commit string
        if: steps.download-main-run.outputs.result == 'true'
        run: |
          unzip primer_commitstring_${{ matrix.python-version }}.zip
          cp commit_string_${{ matrix.python-version }}.txt tests/.pylint_primer_tests/commit_string_${{ matrix.python-version }}.txt
      - name: Unzip the output of 'main'
        if: steps.download-main-run.outputs.result == 'true'
        run: |
          unzip primer_output_main_${{ matrix.python-version }}_batch${{ matrix.batchIdx }}.zip
      - name: Make commit string
        if: steps.download-main-run.outputs.result != 'true'
        run: |
          . venv/bin/activate
          python tests/primer/__main__.py prepare --make-commit-string
      - name: Get commit string
        id: commitstring
        run: |
          . venv/bin/activate
          output=$(python tests/primer/__main__.py prepare --read-commit-string)
          echo "commitstring=$output" >> $GITHUB_OUTPUT
      - name: Restore projects cache
        id: cache-projects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.pylint_primer_tests/
          key: >-
            ${{ runner.os }}-${{ matrix.python-version }}-${{
            steps.commitstring.outputs.commitstring }}-primer
      - name: Regenerate cache
        if: steps.cache-projects.outputs.cache-hit != 'true'
        run: |
          . venv/bin/activate
          python tests/primer/__main__.py prepare --clone
      - name: Save projects cache
        if: steps.cache-projects.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/.pylint_primer_tests/
          key: >-
            ${{ runner.os }}-${{ matrix.python-version }}-${{
            steps.commitstring.outputs.commitstring }}-primer
      - name: Check cache
        run: |
          . venv/bin/activate
          python tests/primer/__main__.py prepare --check

      # Like mypy_primer: lint the 'main' commit this PR is merged into
      - name: Run pylint primer on 'main'
        if: steps.download-main-run.outputs.result != 'true'
        run: |
          . venv/bin/activate
          git worktree add --detach "$RUNNER_TEMP/pylint-main" HEAD^1
          pip install "$RUNNER_TEMP/pylint-main" --no-deps
          python tests/primer/__main__.py run --type=main --batches=${{ matrix.batches }} --batchIdx=${{ matrix.batchIdx }}
          cp tests/.pylint_primer_tests/output_${{ matrix.python-version }}_main_batch${{ matrix.batchIdx }}.txt .

      # Run primer
      - name: Run pylint primer
        id: run-primer
        run: |
          . venv/bin/activate
          pip install . --no-deps
          python tests/primer/__main__.py run --type=pr --batches=${{ matrix.batches }} --batchIdx=${{ matrix.batchIdx }} 2>warnings.txt
      - name: Echo warnings
        if: (success() || failure()) && steps.run-primer.outcome != 'skipped'
        run: |
          WARNINGS=$(head -c 65000 < warnings.txt)
          if [[ $WARNINGS ]]
          then echo "::warning ::$WARNINGS"
          fi
      - name: Upload output of PR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name:
            primer_output_pr_${{ matrix.python-version }}_batch${{ matrix.batchIdx }}
          path:
            tests/.pylint_primer_tests/output_${{ matrix.python-version }}_pr_batch${{
            matrix.batchIdx }}.txt
      - name: Upload output of 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name:
            primer_output_main_${{ matrix.python-version }}_batch${{ matrix.batchIdx }}
          path: output_${{ matrix.python-version }}_main_batch${{ matrix.batchIdx }}.txt

      # Save PR number so we know which PR to comment on
      - name: Save PR number
        run: |
          echo ${{ github.event.pull_request.number }} | tee pr_number.txt
      - name: Upload PR number
        if:
          startsWith(steps.python.outputs.python-version, '3.10') && matrix.batchIdx ==
          0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr_number
          path: pr_number.txt
