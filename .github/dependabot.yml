version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependency"
      - "Skip news :mute:"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependency"
      - "Skip news :mute:"
    open-pull-requests-limit: 10
    rebase-strategy: "disabled"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
